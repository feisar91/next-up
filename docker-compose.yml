services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-checkin}:${POSTGRES_PASSWORD:-checkin}@postgres:5432/${POSTGRES_DB:-checkin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_LIFETIME_HOURS: ${SESSION_LIFETIME_HOURS:-12}
      OFF_DUTY_CHECK_SECONDS: ${OFF_DUTY_CHECK_SECONDS:-300}
      OPENING_HOURS_CHECK_SECONDS: ${OPENING_HOURS_CHECK_SECONDS:-30}
      QUEUE_CLEANUP_CHECK_SECONDS: ${QUEUE_CLEANUP_CHECK_SECONDS:-300}
      LOGIN_MAX_FAILURES_PER_USER: ${LOGIN_MAX_FAILURES_PER_USER:-5}
      LOGIN_MAX_FAILURES_PER_IP: ${LOGIN_MAX_FAILURES_PER_IP:-20}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      BEHIND_PROXY: ${BEHIND_PROXY:-false}
    volumes:
      - checkin_app_data:/data
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-checkin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checkin}
      POSTGRES_DB: ${POSTGRES_DB:-checkin}
    volumes:
      - checkin_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  checkin_pg_data:
  checkin_app_data:
