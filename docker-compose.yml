services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-checkin}:${POSTGRES_PASSWORD:-checkin}@postgres:5432/${POSTGRES_DB:-checkin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_LIFETIME_HOURS: ${SESSION_LIFETIME_HOURS:-12}
    volumes:
      - checkin_app_data:/data
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-checkin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checkin}
      POSTGRES_DB: ${POSTGRES_DB:-checkin}
    volumes:
      - checkin_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  checkin_pg_data:
  checkin_app_data:
