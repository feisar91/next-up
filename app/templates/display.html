<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Queue - {{ location.name }}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon-32.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/brand.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/kiosk-display.css') }}">
</head>
<body>
  <div class="display-screen">
    <div class="connection-banner" id="connection-banner" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
      <span>Connection lost - reconnecting&hellip;</span>
    </div>
    <div class="display-header">
      <img src="{{ url_for('static', filename='images/logo-mark.png') }}" alt="Next Up">
      <h1>{{ location.name }} - Queue</h1>
    </div>
    <div class="display-columns">
      <div>
        <h2>In the Chair</h2>
        <p class="empty-state" id="chair-empty">No one in the chair right now.</p>
        <ul class="chair-list" id="chair-list"></ul>
      </div>
      <div>
        <h2>Waiting</h2>
        <p class="empty-state" id="waiting-empty">No one waiting - walk right in!</p>
        <ul class="waiting-list" id="waiting-list"></ul>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    window.LOCATION_SLUG = "{{ location.slug }}";
    window.DISPLAY_TOKEN = "{{ token }}";
  </script>
  <script src="{{ url_for('static', filename='js/animated-list.js') }}"></script>
  <script src="{{ url_for('static', filename='js/display.js') }}"></script>
</body>
</html>
