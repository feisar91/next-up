{% extends "base.html" %}
{% block title %}Set a New Password - Barber on George{% endblock %}
{% block content %}
  <div class="card" style="max-width:420px;margin:2rem auto;">
    <h1 style="text-align:center;">Set a New Password</h1>
    <p class="meta" style="text-align:center;">You're using a temporary password. Choose your own before continuing.</p>
    <form method="post">
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" required autocomplete="new-password" autofocus>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn" style="width:100%;">Set Password</button>
    </form>
  </div>
{% endblock %}
