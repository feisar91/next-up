{% extends "base.html" %}
{% block title %}Reset Password - {{ barber.name }} - {{ brand.name }}{% endblock %}
{% block content %}
  <h1>Reset Password</h1>

  <div class="card" style="max-width:480px;">
    <p class="meta" style="margin-top:-0.25rem;">
      Set a temporary password for {{ barber.name }}. They'll be required to choose their own
      the next time they log in.
    </p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="password">Temporary password</label>
        <input type="password" id="password" name="password" required autocomplete="new-password" autofocus>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm temporary password</label>
        <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
      </div>
      <div style="display:flex;gap:0.75rem;">
        <button type="submit" class="btn">Set Temporary Password</button>
        <a href="{{ url_for('admin.overview', _anchor='barbers') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
