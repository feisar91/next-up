{% extends "base.html" %}
{% block title %}Edit {{ barber.name }} - Barber on George{% endblock %}
{% block content %}
  <h1>Edit Barber</h1>

  <div class="card" style="max-width:480px;">
    <form method="post">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{ barber.name }}" required>
      </div>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ barber.username }}" required>
      </div>
      <div class="field">
        <label for="default_location_id">Default location</label>
        <select id="default_location_id" name="default_location_id">
          <option value="">No default</option>
          {% for location in locations %}
            <option value="{{ location.id }}" {% if barber.default_location_id == location.id %}selected{% endif %}>
              {{ location.name }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label><input type="checkbox" name="is_admin" style="width:auto;display:inline-block;" {% if barber.is_admin %}checked{% endif %}> Grant admin access</label>
      </div>
      <div style="display:flex;gap:0.75rem;">
        <button type="submit" class="btn">Save Changes</button>
        <a href="{{ url_for('admin.overview', _anchor='barbers') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
