{% extends "base.html" %}
{% block title %}Log in - {{ brand.name }}{% endblock %}
{% block content %}
  {% if demo %}{% include "_demo_intro.html" %}{% endif %}
  <div class="card" style="max-width:420px;margin:2rem auto;">
    <h1 style="text-align:center;">Staff Log In</h1>
    {% with setup=False %}{% include "_cookie_warning.html" %}{% endwith %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn" style="width:100%;">Log In</button>
    </form>
  </div>
{% endblock %}
